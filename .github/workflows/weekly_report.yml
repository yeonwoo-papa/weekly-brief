name: Weekly Macro Report & Web Sync

on:
  schedule:
    # 매주 월요일 오전 08:17 KST (정각 트래픽 혼잡 회피, UTC 일요일 23:17)
    - cron: '17 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & Chromium
        run: |
          pip install --upgrade -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate Weekly PDF Report, Web JSON & Send Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: 'Asia/Seoul'
        run: |
          python -u weekly_macro_report_argon.py

      - name: Commit & Push latest_report.json for Mobile Web Sync
        run: |
          if [ -f latest_report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest_report.json
            git diff --staged --quiet || git commit -m "chore: update weekly macro report JSON"
            git push
          fi
